name: Commit messages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Check commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TRAILER: "Co-Authored-By: Claude Code <noreply@anthropic.com>"
        run: |
          # A new branch or manual run has no base; check only the head commit.
          if [ -z "${BASE//0/}" ]; then
            commits="$HEAD"
          else
            commits=$(git rev-list --no-merges "$BASE..$HEAD")
          fi
          status=0
          for sha in $commits; do
            echo "$(git log -1 --format='%h %s' "$sha")"
            git log -1 --format=%B "$sha" | python3 .github/scripts/lint-commit.py --trailer "$TRAILER" - || status=1
          done
          exit $status
